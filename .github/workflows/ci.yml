name : CI Pipeline

on :
  push :
    branches : 
      - main

jobs :
  build :
    runs-on : ubuntu-latest
    steps :
      - name : Checkout code
        uses: actions/checkout@v3
      
      - name : Set up node js
        uses : actions/setup-node@v3
        with:
          node-version: 20
      
      - name: Install dependencies # 패키지 설치
        run: npm install

      - name: Run tests  # 테스트 실행
        run: npm test
  
  deploy :
    needs : build
    runs-on : ubuntu-latest
    steps :
      - name : Deploy to production
        run: |
          echo "Deployment!!"